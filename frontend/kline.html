<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Stock Kline Chart</title>
    <script src="https://cdn.jsdelivr.net/npm/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        /* 图表容器相对定位，以便内部绝对定位 legend */
        .chart-container {
            position: relative;
            width: 100%;
            height: 600px;
            margin-top: 20px;
        }
        /* 鼠标悬停信息提示框 */
        #legend {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 8px 12px;
            font-size: 14px;
            line-height: 1.6;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            pointer-events: none;   /* 防止遮挡鼠标操作 */
            z-index: 10;
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body>

<h2>Stock Kline Chart</h2>

<input id="codeInput" placeholder="Enter ticker, e.g. sh.600004">
<button onclick="loadKline()">Load Kline</button>

<!-- 图表容器（带相对定位） -->
<div class="chart-container">
    <div id="chart" style="width:100%; height:100%;"></div>
</div>

<script>
let chart;
let candleSeries;
let volumeSeries;

// =======================
// Initialize chart (run once)
// =======================
function initChart() {
    chart = LightweightCharts.createChart(
        document.getElementById("chart"),
        {
            height: 600,
            layout: {
                background: { color: "#ffffff" },
                textColor: "#333"
            },
            grid: {
                vertLines: { color: "#f0f3fa" },
                horzLines: { color: "#f0f3fa" }
            },
            rightPriceScale: {
                borderColor: "#ddd",
            },
            timeScale: {
                borderColor: "#ddd",
                timeVisible: true,
                secondsVisible: false,
            },
            crosshair: {
                mode: LightweightCharts.CrosshairMode.Normal,
            }
        }
    );

    // ===== Candlestick =====
    candleSeries = chart.addSeries(
        LightweightCharts.CandlestickSeries,
        {
            upColor: "#e74c3c",
            downColor: "#2ecc71",
            borderUpColor: "#e74c3c",
            borderDownColor: "#2ecc71",
            wickUpColor: "#e74c3c",
            wickDownColor: "#2ecc71"
        }
    );

    // ===== Volume (bottom area) =====
    volumeSeries = chart.addSeries(
        LightweightCharts.HistogramSeries,
        {
            priceFormat: { type: 'volume' },
            priceScaleId: 'volume',
        }
    );

    chart.priceScale('volume').applyOptions({
        scaleMargins: {
            top: 0.75,
            bottom: 0,
        },
    });

    // ================================
    // Tooltip / Legend on Hover
    // ================================
    const legend = document.getElementById("legend");

    chart.subscribeCrosshairMove(param => {

        if (!param.time || param.point.x < 0 || param.point.y < 0) {
            legend.innerHTML = "Hover over a candle to see OHLC data";
            return;
        }

        const price = param.seriesPrices.get(candleSeries);
        if (!price) return;

        const volume = param.seriesPrices.get(volumeSeries);
        const dateStr = new Date(param.time * 1000).toLocaleDateString();

        legend.innerHTML = `
            <b>${dateStr}</b><br/>
            Open: ${price.open.toFixed(2)}<br/>
            High: ${price.high.toFixed(2)}<br/>
            Low: ${price.low.toFixed(2)}<br/>
            Close: ${price.close.toFixed(2)}<br/>
            Volume: ${volume ? volume.toLocaleString() : "-"}
        `;
    });
}

// =======================
// Load data from backend
// =======================
async function loadKline() {

    const code = document.getElementById("codeInput").value;
    if (!code) {
        alert("Please enter ticker");
        return;
    }

    const response = await fetch(`http://127.0.0.1:8000/api/price?code=${code}`);
    const rawData = await response.json();

    // Convert backend data → chart format
    const candleData = rawData.map(item => ({
        time: new Date(item.date).getTime() / 1000,
        open: item.open,
        high: item.high,
        low: item.low,
        close: item.close
    }));

    const volumeData = rawData.map(item => ({
        time: new Date(item.date).getTime() / 1000,
        value: item.volume,
        color: item.close >= item.open ? "#e74c3c" : "#2ecc71"
    }));

    candleSeries.setData(candleData);
    volumeSeries.setData(volumeData);
    chart.timeScale().fitContent();
}

// Run once when page loads
initChart();

</script>

</body>
</html>
